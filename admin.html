<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Guest List — Admin</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="manifest" href="/site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
:root { --white:#f0ece3; --yellow:#e8d84a; --dim:rgba(240,236,227,0.42); --border:rgba(240,236,227,0.12); }
body { background:#060606; color:var(--white); font-family:'Syne',sans-serif; min-height:100vh; }

/* gate */
.gate { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:2rem; }
.gate-card { width:min(380px,92vw); text-align:center; }
.gate-card h1 { font-family:'Syne'; font-weight:800; font-size:1.6rem; margin-bottom:0.4rem; }
.gate-card p { font-family:'Space Mono',monospace; font-size:0.6rem; letter-spacing:0.16em; text-transform:uppercase; color:var(--dim); margin-bottom:1.6rem; }
.pass-wrap { position:relative; }
.gate input {
  width:100%; background:rgba(255,255,255,0.04); border:1px solid rgba(240,236,227,0.14);
  color:var(--white); padding:0.85rem 2.6rem 0.85rem 1rem; font-family:'Syne'; font-size:0.95rem; outline:none; text-align:center; letter-spacing:0.1em;
}
.gate input:focus { border-color:rgba(240,236,227,0.4); }
.eye {
  position:absolute; top:50%; right:0.55rem; transform:translateY(-50%);
  display:flex; align-items:center; justify-content:center;
  background:none; border:none; padding:0.3rem; cursor:pointer;
  color:rgba(240,236,227,0.5); transition:color 0.2s;
}
.eye:hover { color:var(--white); }
.eye svg { width:18px; height:18px; display:block; }
.gate button.go {
  width:100%; margin-top:0.9rem; background:var(--yellow); color:#060606; border:none; padding:0.85rem;
  font-family:'Space Mono',monospace; font-size:0.65rem; letter-spacing:0.22em; text-transform:uppercase; font-weight:700; cursor:pointer;
}
.gate .err { color:#ff5544; font-family:'Space Mono',monospace; font-size:0.6rem; letter-spacing:0.06em; margin-top:0.9rem; min-height:1em; }

/* app */
.app { display:none; padding:2rem clamp(1rem,4vw,3rem) 4rem; }
.app.show { display:block; }
.bar { display:flex; flex-wrap:wrap; gap:1rem; align-items:center; justify-content:space-between; margin-bottom:1rem; }
.bar h1 { font-family:'Syne'; font-weight:800; font-size:1.5rem; }
.bar .count { font-family:'Space Mono',monospace; font-size:0.6rem; letter-spacing:0.16em; text-transform:uppercase; color:var(--dim); margin-left:0.6rem; }
.back-site { display:inline-block; font-family:'Space Mono',monospace; font-size:0.55rem; letter-spacing:0.16em; text-transform:uppercase; color:var(--dim); text-decoration:none; margin-bottom:0.4rem; transition:color .2s; }
.back-site:hover { color:var(--white); }
.controls { display:flex; flex-wrap:wrap; gap:0.6rem; align-items:center; }

/* batch bar */
.batchbar {
  display:flex; flex-wrap:wrap; gap:0.7rem 1rem; align-items:center;
  padding:0.9rem 1rem; margin-bottom:1.2rem;
  border:1px solid var(--border); background:rgba(240,236,227,0.02);
}
.collecting { font-family:'Space Mono',monospace; font-size:0.6rem; letter-spacing:0.14em; text-transform:uppercase; color:var(--dim); display:flex; align-items:center; gap:0.5rem; }
.collecting b { color:var(--yellow); font-weight:700; }
.dot { width:7px; height:7px; border-radius:50%; background:var(--yellow); box-shadow:0 0 0 3px rgba(232,216,74,0.18); }
.batchbar .sep { flex:1; }
.field-label { font-family:'Space Mono',monospace; font-size:0.55rem; letter-spacing:0.14em; text-transform:uppercase; color:var(--dim); }

input.ctl, select.ctl {
  background:rgba(255,255,255,0.04); border:1px solid var(--border); color:var(--white);
  padding:0.5rem 0.8rem; font-family:'Space Mono',monospace; font-size:0.7rem; outline:none;
}
input.ctl:focus, select.ctl:focus { border-color:rgba(240,236,227,0.32); }
button.ctl {
  background:none; border:1px solid var(--border); color:var(--white);
  padding:0.5rem 0.9rem; font-family:'Space Mono',monospace; font-size:0.6rem; letter-spacing:0.14em; text-transform:uppercase; cursor:pointer; transition:border-color .2s,background .2s;
}
button.ctl:hover { border-color:rgba(240,236,227,0.4); background:rgba(240,236,227,0.04); }
button.ctl.primary { background:var(--yellow); color:#060606; border-color:var(--yellow); font-weight:700; }
button.ctl.danger:hover { border-color:#ff5544; color:#ff5544; background:rgba(255,85,68,0.06); }
button.ctl[disabled] { opacity:0.3; pointer-events:none; }

.table-wrap { overflow-x:auto; border:1px solid var(--border); }
table { border-collapse:collapse; width:100%; min-width:760px; }
th, td { text-align:left; padding:0.7rem 1rem; border-bottom:1px solid var(--border); font-size:0.82rem; vertical-align:top; white-space:nowrap; }
th { font-family:'Space Mono',monospace; font-size:0.55rem; letter-spacing:0.16em; text-transform:uppercase; color:var(--dim); position:sticky; top:0; background:#0b0b0b; }
td { font-family:'Syne'; color:var(--white); }
tr:hover td { background:rgba(240,236,227,0.03); }
td.tier-ff { color:var(--yellow); }
.ig-link { color:var(--yellow); text-decoration:none; }
.ig-link:hover { text-decoration:underline; }
.del { background:none; border:none; color:rgba(240,236,227,0.35); cursor:pointer; font-size:1rem; line-height:1; padding:0.1rem 0.3rem; transition:color .2s; }
.del:hover { color:#ff5544; }
.empty, .loading { padding:3rem 1rem; text-align:center; color:var(--dim); font-family:'Space Mono',monospace; font-size:0.7rem; letter-spacing:0.16em; }
.hint { font-family:'Space Mono',monospace; font-size:0.55rem; letter-spacing:0.1em; color:rgba(240,236,227,0.28); margin-top:1.2rem; line-height:1.8; }
.rowcheck, #check-all { cursor:pointer; width:15px; height:15px; accent-color:#e8d84a; vertical-align:middle; }
th.check, td.check { width:34px; text-align:center; }
.cmp-overlay { position:fixed; inset:0; z-index:100; background:rgba(0,0,0,0.78); backdrop-filter:blur(8px); display:none; align-items:center; justify-content:center; padding:1.5rem; }
.cmp-overlay.open { display:flex; }
.cmp { width:min(520px,94vw); background:#0e0e0e; border:1px solid var(--border); padding:1.8rem; }
.cmp h2 { font-family:'Syne'; font-weight:800; font-size:1.2rem; margin-bottom:0.3rem; }
.cmp .who { font-family:'Space Mono',monospace; font-size:0.6rem; letter-spacing:0.14em; text-transform:uppercase; color:var(--yellow); margin-bottom:1.3rem; }
.cmp label { display:block; font-family:'Space Mono',monospace; font-size:0.55rem; letter-spacing:0.16em; text-transform:uppercase; color:var(--dim); margin:0 0 0.4rem; }
.cmp input, .cmp textarea { width:100%; background:rgba(255,255,255,0.04); border:1px solid var(--border); color:var(--white); padding:0.7rem 0.9rem; font-family:'Syne'; font-size:0.9rem; outline:none; margin-bottom:1.1rem; }
.cmp textarea { min-height:150px; line-height:1.5; resize:vertical; }
.cmp input:focus, .cmp textarea:focus { border-color:rgba(240,236,227,0.32); }
.cmp-row { display:flex; gap:0.7rem; justify-content:flex-end; }
</style>
</head>
<body>

<!-- PASSCODE GATE -->
<div class="gate" id="gate">
  <div class="gate-card">
    <h1>The Pregame</h1>
    <p>Guest List — Admin</p>
    <div class="pass-wrap">
      <input id="passcode" type="password" placeholder="Passcode" autocomplete="off" autofocus>
      <button type="button" class="eye" id="toggle-pass" aria-label="Show passcode"></button>
    </div>
    <button class="go" id="enter">Enter</button>
    <div class="err" id="err"></div>
    <a class="back-site" href="/" style="margin-top:1.4rem;">← Back to site</a>
  </div>
</div>

<!-- APP -->
<div class="app" id="app">
  <div class="bar">
    <div>
      <a class="back-site" href="/">← Back to site</a>
      <h1>Guest List<span class="count" id="count"></span></h1>
    </div>
    <div class="controls">
      <input class="ctl" id="search" type="text" placeholder="Search…">
      <select class="ctl" id="tier"><option value="">All tiers</option></select>
      <button class="ctl primary" id="send-invite">Send invite</button>
      <button class="ctl" id="csv">Export CSV</button>
      <button class="ctl" id="refresh">Refresh</button>
      <button class="ctl" id="logout">Log out</button>
    </div>
  </div>

  <div class="batchbar">
    <span class="collecting"><span class="dot"></span>Now collecting for <b id="active-name">—</b></span>
    <span class="sep"></span>
    <span class="field-label">Viewing</span>
    <select class="ctl" id="batch-view"></select>
    <button class="ctl" id="new-batch">+ New event</button>
    <button class="ctl" id="make-active">Make active</button>
    <button class="ctl danger" id="clear-batch">Clear batch</button>
  </div>

  <div class="table-wrap"><div id="table"></div></div>
  <p class="hint">Submissions land in the active batch. Start a new event to send incoming requests to a fresh box; past events stay intact. Read-only otherwise; data lives on the Pregame Worker.</p>
</div>

<div class="cmp-overlay" id="cmp-overlay">
  <div class="cmp">
    <h2>Send invite</h2>
    <p class="who" id="cmp-who"></p>
    <label>Subject</label>
    <input id="cmp-subject" type="text">
    <label>Message</label>
    <textarea id="cmp-message"></textarea>
    <div class="cmp-row">
      <button class="ctl" id="cmp-cancel">Cancel</button>
      <button class="ctl primary" id="cmp-send">Send</button>
    </div>
  </div>
</div>

<script>
(function(){
  /* ── CONFIG ── base URL of the Cloudflare Worker ── */
  var API = 'https://pregame-signup.jacob-bee.workers.dev';

  var ORDER = ['submittedAt','timestamp','date','time','batch','tier',
    'First Name','Last Name','Email Address','Phone Number','Instagram Handle','Industry / What You Do','Tell Us About Yourself'];
  var HIDDEN_COLS = { _key:1 };

  var gate=document.getElementById('gate'), app=document.getElementById('app');
  var pass=document.getElementById('passcode'), err=document.getElementById('err');
  var rows=[], active='', view='', code='', selected={};
  var DEMO = /[?&]demo/.test(location.search);

  function esc(v){ return String(v==null?'':v).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function igLink(v){
    var raw=String(v==null?'':v).trim();
    if(!raw) return '';
    var user=raw.replace(/^@+/,'').replace(/^https?:\/\/(www\.)?instagram\.com\//i,'').replace(/[\/?].*$/,'').trim();
    if(!user) return esc(raw);
    return '<a class="ig-link" href="https://instagram.com/'+encodeURIComponent(user)+'" target="_blank" rel="noopener">'+esc(raw)+'</a>';
  }

  /* ── data layer (live worker, or in-memory demo) ── */
  var demoState={ active:'Vol. 25', rows:[
    {_key:'d1', batch:'Vol. 25', submittedAt:'2026-06-19 18:42', tier:'General', 'First Name':'Ava','Last Name':'Thompson','Email Address':'ava@example.com','Phone Number':'+1 (212) 555-0182','Instagram Handle':'@avathompson','Industry / What You Do':'Finance'},
    {_key:'d2', batch:'Vol. 25', submittedAt:'2026-06-19 18:51', tier:'Friends & Family', 'First Name':'Marcus','Last Name':'Lee','Email Address':'marcus@example.com','Phone Number':'+1 (646) 555-0143','Instagram Handle':'@marcuslee','Industry / What You Do':'Tech'},
    {_key:'d3', batch:'Vol. 24', submittedAt:'2026-05-28 21:03', tier:'General', 'First Name':'Sofia','Last Name':'Ramirez','Email Address':'sofia@example.com','Phone Number':'+1 (917) 555-0119','Instagram Handle':'@sofiaramirez','Industry / What You Do':'Media'}
  ]};

  function api(path, opts){
    if(DEMO) return demoApi(path, opts);
    opts = opts || {};
    opts.headers = Object.assign({ 'Authorization':'Bearer '+code }, opts.headers||{});
    if(opts.body) opts.headers['Content-Type']='application/json';
    return fetch(API+path, opts).then(function(r){
      if(r.status===401||r.status===403) throw new Error('unauthorized');
      if(!r.ok) throw new Error('http '+r.status);
      return r.json();
    });
  }
  function demoApi(path, opts){
    var body = opts && opts.body ? JSON.parse(opts.body) : {};
    if(path==='/list' || path.indexOf('/list?')===0){ return Promise.resolve(demoState.rows.slice()); }
    if(path==='/batches'){
      var counts={}; demoState.rows.forEach(function(r){counts[r.batch]=(counts[r.batch]||0)+1;});
      if(!(demoState.active in counts)) counts[demoState.active]=0;
      return Promise.resolve({active:demoState.active, batches:Object.keys(counts).map(function(n){return {name:n,count:counts[n]};})});
    }
    if(path==='/batch'){ demoState.active=body.name; return Promise.resolve({ok:true,active:body.name}); }
    if(path==='/delete'){ demoState.rows=demoState.rows.filter(function(r){return r._key!==body.key;}); return Promise.resolve({ok:true}); }
    if(path==='/clear'){ demoState.rows=demoState.rows.filter(function(r){return r.batch!==body.batch;}); return Promise.resolve({ok:true}); }
    if(path==='/invite'){ return Promise.resolve({ok:true, sent:(body.recipients||[]).length}); }
    return Promise.resolve({});
  }

  /* ── render ── */
  function columns(data){
    var seen={}, cols=[];
    ORDER.forEach(function(k){ if(!HIDDEN_COLS[k] && data.some(function(r){return k in r;})){ cols.push(k); seen[k]=1; } });
    data.forEach(function(r){ Object.keys(r).forEach(function(k){ if(!seen[k] && !HIDDEN_COLS[k]){ seen[k]=1; cols.push(k); } }); });
    return cols;
  }
  function viewRows(){ return view ? rows.filter(function(r){return r.batch===view;}) : rows.slice(); }
  function filtered(){
    var q=(document.getElementById('search').value||'').toLowerCase().trim();
    var t=document.getElementById('tier').value;
    return viewRows().filter(function(r){
      if(t && String(r.tier||'')!==t) return false;
      if(!q) return true;
      return Object.keys(r).some(function(k){ return k!=='_key' && String(r[k]||'').toLowerCase().indexOf(q)>=0; });
    });
  }
  function render(){
    var data=filtered(), cols=columns(viewRows()), el=document.getElementById('table');
    document.getElementById('count').textContent=' · '+data.length+(data.length===1?' entry':' entries');
    if(!data.length){ el.innerHTML='<div class="empty">No submissions'+(view?' in “'+esc(view)+'”':'')+'.</div>'; updateInviteBtn(); return; }
    var html='<table><thead><tr><th class="check"><input type="checkbox" id="check-all"></th>'+cols.map(function(c){return '<th>'+esc(c)+'</th>';}).join('')+'<th></th></tr></thead><tbody>';
    html+=data.map(function(r){
      var cells=cols.map(function(c){
        var cls = (c==='tier' && /family|ff/i.test(String(r[c]||''))) ? ' class="tier-ff"' : '';
        var val = (c==='Instagram Handle') ? igLink(r[c]) : esc(r[c]);
        return '<td'+cls+'>'+val+'</td>';
      }).join('');
      return '<tr><td class="check"><input type="checkbox" class="rowcheck" data-key="'+esc(r._key)+'"'+(selected[r._key]?' checked':'')+'></td>'+cells+'<td><button class="del" data-key="'+esc(r._key)+'" title="Delete">&times;</button></td></tr>';
    }).join('');
    el.innerHTML=html+'</tbody></table>';
    var ca=document.getElementById('check-all'), fr=filtered();
    if(ca) ca.checked = fr.length>0 && fr.every(function(r){return selected[r._key];});
    updateInviteBtn();
  }

  function fillSelect(sel, values, current){
    sel.innerHTML = values.map(function(o){ return '<option value="'+esc(o.value)+'"'+(o.value===current?' selected':'')+'>'+esc(o.label)+'</option>'; }).join('');
  }
  function refreshUI(batches){
    document.getElementById('active-name').textContent = active || '—';
    var opts=[{value:'',label:'All events'}].concat(batches.map(function(b){
      return {value:b.name, label:b.name+' ('+b.count+')'+(b.name===active?' • active':'')};
    }));
    if(view && !batches.some(function(b){return b.name===view;})) view='';
    fillSelect(document.getElementById('batch-view'), opts, view);
    var tsel=document.getElementById('tier'), have={};
    Array.from(tsel.options).slice(1).forEach(function(o){have[o.value]=1;});
    viewRows().forEach(function(r){ var t=String(r.tier||''); if(t && !have[t]){ have[t]=1; var o=document.createElement('option'); o.value=o.textContent=t; tsel.appendChild(o); } });
    document.getElementById('make-active').style.display = (view && view!==active) ? '' : 'none';
    document.getElementById('clear-batch').disabled = !view;
    render();
  }

  function load(){
    document.getElementById('table').innerHTML='<div class="loading">Loading…</div>';
    return Promise.all([ api('/batches'), api('/list') ]).then(function(res){
      active = res[0].active || '';
      rows = Array.isArray(res[1]) ? res[1] : (res[1].submissions||[]);
      refreshUI(res[0].batches||[]);
    });
  }

  function toCSV(){
    var data=filtered(), cols=columns(viewRows());
    function q(v){ v=String(v==null?'':v); return '"'+v.replace(/"/g,'""')+'"'; }
    var lines=[cols.map(q).join(',')].concat(data.map(function(r){ return cols.map(function(c){return q(r[c]);}).join(','); }));
    var blob=new Blob([lines.join('\n')],{type:'text/csv'});
    var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='guestlist'+(view?'-'+view.replace(/[^a-z0-9]+/gi,'-'):'')+'.csv'; a.click();
  }

  /* ── actions ── */
  function newBatch(){
    var name=prompt('Name this event (incoming submissions will go here):');
    if(!name || !name.trim()) return;
    api('/batch', { method:'POST', body:JSON.stringify({ name:name.trim() }) })
      .then(function(){ view=name.trim(); return load(); })
      .catch(alertErr);
  }
  function makeActive(){
    if(!view) return;
    if(!confirm('Send new submissions to “'+view+'” from now on?')) return;
    api('/batch', { method:'POST', body:JSON.stringify({ name:view }) }).then(load).catch(alertErr);
  }
  function clearBatch(){
    if(!view) return;
    if(!confirm('Delete ALL submissions in “'+view+'”? This cannot be undone.')) return;
    api('/clear', { method:'POST', body:JSON.stringify({ batch:view }) }).then(load).catch(alertErr);
  }
  function delRow(key){
    if(!confirm('Delete this submission?')) return;
    api('/delete', { method:'POST', body:JSON.stringify({ key:key }) }).then(load).catch(alertErr);
  }
  function alertErr(e){ alert(e && e.message==='unauthorized' ? 'Session expired — log in again.' : 'Action failed. Try again.'); }

  /* ── invites ── */
  function selCount(){ return Object.keys(selected).length; }
  function updateInviteBtn(){
    var n=selCount(), b=document.getElementById('send-invite');
    if(b) b.textContent = n ? ('Send invite ('+n+')') : 'Send invite';
  }
  function recipientsForInvite(){
    var keys = selCount() ? Object.keys(selected) : filtered().map(function(r){return r._key;});
    var byKey={}; rows.forEach(function(r){ byKey[r._key]=r; });
    return keys.map(function(k){ return byKey[k]; }).filter(Boolean)
      .map(function(r){ return { email:String(r['Email Address']||'').trim(), first:String(r['First Name']||'').trim() }; })
      .filter(function(r){ return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(r.email); });
  }
  function openCompose(){
    var recips=recipientsForInvite();
    if(!recips.length){ alert('No valid email addresses in that selection.'); return; }
    var ev = active || view || 'the event';
    document.getElementById('cmp-who').textContent = 'To '+recips.length+' guest'+(recips.length===1?'':'s')+(selCount()?' selected':' shown');
    document.getElementById('cmp-subject').value = "You're invited — The Pregame";
    document.getElementById('cmp-message').value = "You're in.\n\n"+ev+" — [date], [location].\n\nMore details to follow. Keep this one close.\n\nSee you in the room.";
    document.getElementById('cmp-overlay').classList.add('open');
  }
  function sendInvite(){
    var recips=recipientsForInvite(); if(!recips.length) return;
    var subject=document.getElementById('cmp-subject').value.trim();
    var message=document.getElementById('cmp-message').value;
    var btn=document.getElementById('cmp-send'); btn.disabled=true; btn.textContent='Sending…';
    api('/invite', { method:'POST', body:JSON.stringify({ recipients:recips, subject:subject, message:message }) })
      .then(function(res){
        document.getElementById('cmp-overlay').classList.remove('open');
        var n = (res && res.sent!=null) ? res.sent : recips.length;
        alert('Invite sent to '+n+' guest'+(n===1?'':'s')+'.');
      })
      .catch(function(e){ alert(e && e.message==='unauthorized' ? 'Session expired — log in again.' : 'Send failed — is email set up in the Worker (RESEND_API_KEY)?'); })
      .finally(function(){ btn.disabled=false; btn.textContent='Send'; });
  }

  /* ── wire up ── */
  document.getElementById('search').addEventListener('input', render);
  document.getElementById('tier').addEventListener('change', render);
  document.getElementById('refresh').addEventListener('click', function(){ load().catch(function(){}); });
  document.getElementById('csv').addEventListener('click', toCSV);
  document.getElementById('logout').addEventListener('click', function(){ location.reload(); });
  document.getElementById('batch-view').addEventListener('change', function(){ view=this.value; load().catch(render); });
  document.getElementById('new-batch').addEventListener('click', newBatch);
  document.getElementById('make-active').addEventListener('click', makeActive);
  document.getElementById('clear-batch').addEventListener('click', clearBatch);
  document.getElementById('table').addEventListener('click', function(e){
    var b=e.target.closest('.del'); if(b) delRow(b.getAttribute('data-key'));
  });
  document.getElementById('table').addEventListener('change', function(e){
    if(e.target.id==='check-all'){
      var on=e.target.checked;
      filtered().forEach(function(r){ if(on) selected[r._key]=true; else delete selected[r._key]; });
      render();
    } else if(e.target.classList.contains('rowcheck')){
      var k=e.target.getAttribute('data-key');
      if(e.target.checked) selected[k]=true; else delete selected[k];
      var ca=document.getElementById('check-all'), fr=filtered();
      if(ca) ca.checked = fr.length>0 && fr.every(function(r){return selected[r._key];});
      updateInviteBtn();
    }
  });
  document.getElementById('send-invite').addEventListener('click', openCompose);
  document.getElementById('cmp-cancel').addEventListener('click', function(){ document.getElementById('cmp-overlay').classList.remove('open'); });
  document.getElementById('cmp-send').addEventListener('click', sendInvite);
  document.getElementById('cmp-overlay').addEventListener('click', function(e){ if(e.target.id==='cmp-overlay') this.classList.remove('open'); });

  /* passcode + eye */
  var EYE_SHOW='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>';
  var EYE_HIDE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20C5 20 1 12 1 12a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="2" y1="2" x2="22" y2="22"/></svg>';
  var eyeBtn=document.getElementById('toggle-pass'); eyeBtn.innerHTML=EYE_SHOW;
  eyeBtn.addEventListener('click', function(){
    var shown=pass.type==='text'; pass.type=shown?'password':'text';
    eyeBtn.innerHTML=shown?EYE_SHOW:EYE_HIDE;
    eyeBtn.setAttribute('aria-label', shown?'Show passcode':'Hide passcode'); pass.focus();
  });

  function enter(){ gate.style.display='none'; app.classList.add('show'); }
  function unlock(){
    code=pass.value.trim(); if(!code) return; err.textContent='';
    load().then(enter).catch(function(e){
      err.textContent = e && e.message==='unauthorized' ? 'Incorrect passcode.' : 'Could not reach the server.';
    });
  }
  document.getElementById('enter').addEventListener('click', unlock);
  pass.addEventListener('keydown', function(e){ if(e.key==='Enter') unlock(); });

  // No session persistence — the passcode is required every time the page loads.
  if(DEMO){ code='demo'; }
})();
</script>
</body>
</html>
