<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Guest List — Admin</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="manifest" href="/site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
:root { --white:#f0ece3; --yellow:#e8d84a; --dim:rgba(240,236,227,0.42); --border:rgba(240,236,227,0.12); }
body { background:#060606; color:var(--white); font-family:'Syne',sans-serif; min-height:100vh; }

/* gate */
.gate { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:2rem; }
.gate-card { width:min(380px,92vw); text-align:center; }
.gate-card h1 { font-family:'Syne'; font-weight:800; font-size:1.6rem; margin-bottom:0.4rem; }
.gate-card p { font-family:'Space Mono',monospace; font-size:0.6rem; letter-spacing:0.16em; text-transform:uppercase; color:var(--dim); margin-bottom:1.6rem; }
.gate input {
  width:100%; background:rgba(255,255,255,0.04); border:1px solid rgba(240,236,227,0.14);
  color:var(--white); padding:0.85rem 2.6rem 0.85rem 1rem; font-family:'Syne'; font-size:0.95rem; outline:none; text-align:center; letter-spacing:0.1em;
}
.gate input:focus { border-color:rgba(240,236,227,0.4); }
.pass-wrap { position:relative; }
.eye {
  position:absolute; top:50%; right:0.55rem; transform:translateY(-50%);
  display:flex; align-items:center; justify-content:center;
  background:none; border:none; padding:0.3rem; cursor:pointer;
  color:rgba(240,236,227,0.5); transition:color 0.2s;
}
.eye:hover { color:var(--white); }
.eye svg { width:18px; height:18px; display:block; }
.gate button:not(.eye) {
  width:100%; margin-top:0.9rem; background:var(--yellow); color:#060606; border:none; padding:0.85rem;
  font-family:'Space Mono',monospace; font-size:0.65rem; letter-spacing:0.22em; text-transform:uppercase; font-weight:700; cursor:pointer;
}
.gate .err { color:#ff5544; font-family:'Space Mono',monospace; font-size:0.6rem; letter-spacing:0.06em; margin-top:0.9rem; min-height:1em; text-transform:none; }

/* app */
.app { display:none; padding:2rem clamp(1rem,4vw,3rem) 4rem; }
.app.show { display:block; }
.bar { display:flex; flex-wrap:wrap; gap:1rem; align-items:center; justify-content:space-between; margin-bottom:1.5rem; }
.bar h1 { font-family:'Syne'; font-weight:800; font-size:1.5rem; }
.bar .count { font-family:'Space Mono',monospace; font-size:0.6rem; letter-spacing:0.16em; text-transform:uppercase; color:var(--dim); margin-left:0.6rem; }
.controls { display:flex; flex-wrap:wrap; gap:0.6rem; align-items:center; }
.controls input, .controls select {
  background:rgba(255,255,255,0.04); border:1px solid var(--border); color:var(--white);
  padding:0.5rem 0.8rem; font-family:'Space Mono',monospace; font-size:0.7rem; outline:none;
}
.controls input:focus, .controls select:focus { border-color:rgba(240,236,227,0.32); }
.controls button {
  background:none; border:1px solid var(--border); color:var(--white);
  padding:0.5rem 0.9rem; font-family:'Space Mono',monospace; font-size:0.6rem; letter-spacing:0.14em; text-transform:uppercase; cursor:pointer; transition:border-color .2s,background .2s;
}
.controls button:hover { border-color:rgba(240,236,227,0.4); background:rgba(240,236,227,0.04); }
.controls button.primary { background:var(--yellow); color:#060606; border-color:var(--yellow); font-weight:700; }

.table-wrap { overflow-x:auto; border:1px solid var(--border); }
table { border-collapse:collapse; width:100%; min-width:760px; }
th, td { text-align:left; padding:0.7rem 1rem; border-bottom:1px solid var(--border); font-size:0.82rem; vertical-align:top; white-space:nowrap; }
th { font-family:'Space Mono',monospace; font-size:0.55rem; letter-spacing:0.16em; text-transform:uppercase; color:var(--dim); position:sticky; top:0; background:#0b0b0b; }
td { font-family:'Syne'; color:var(--white); }
tr:hover td { background:rgba(240,236,227,0.03); }
td.tier-ff { color:var(--yellow); }
.ig-link { color:var(--yellow); text-decoration:none; }
.ig-link:hover { text-decoration:underline; }
.empty, .loading { padding:3rem 1rem; text-align:center; color:var(--dim); font-family:'Space Mono',monospace; font-size:0.7rem; letter-spacing:0.16em; }
.hint { font-family:'Space Mono',monospace; font-size:0.55rem; letter-spacing:0.1em; color:rgba(240,236,227,0.28); margin-top:1.2rem; line-height:1.8; }
</style>
</head>
<body>

<!-- PASSCODE GATE -->
<div class="gate" id="gate">
  <div class="gate-card">
    <h1>The Pregame</h1>
    <p>Guest List — Admin</p>
    <div class="pass-wrap">
      <input id="passcode" type="password" placeholder="Passcode" autocomplete="off" autofocus>
      <button type="button" class="eye" id="toggle-pass" aria-label="Show passcode"></button>
    </div>
    <button id="enter">Enter</button>
    <div class="err" id="err"></div>
  </div>
</div>

<!-- APP -->
<div class="app" id="app">
  <div class="bar">
    <div><h1>Guest List<span class="count" id="count"></span></h1></div>
    <div class="controls">
      <input id="search" type="text" placeholder="Search…">
      <select id="tier"><option value="">All tiers</option></select>
      <button id="refresh">Refresh</button>
      <button id="csv" class="primary">Export CSV</button>
      <button id="logout">Log out</button>
    </div>
  </div>
  <div class="table-wrap"><div id="table"></div></div>
  <p class="hint">Read-only. Data is served by the Pregame Worker and only returned when the correct passcode is supplied; nothing is stored in this page.</p>
</div>

<script>
(function(){
  /* ── CONFIG ──────────────────────────────────────────────
     The protected endpoint on the Cloudflare Worker that returns
     the submissions as JSON when the passcode is supplied. Set this
     once the Worker's list endpoint is live. */
  var API = 'https://pregame-signup.jacob-bee.workers.dev/list';

  /* Preferred column order; any other keys are appended after these. */
  var ORDER = ['submittedAt','timestamp','date','time','tier',
    'First Name','Last Name','Email Address','Phone Number','Instagram Handle','Industry / What You Do'];

  var gate=document.getElementById('gate'), app=document.getElementById('app');
  var pass=document.getElementById('passcode'), err=document.getElementById('err');
  var rows=[], code='';

  /* sample data for ?demo preview only (no real data) */
  var DEMO=[
    {submittedAt:'2026-06-18 19:04', tier:'General', 'First Name':'Jordan','Last Name':'Smith','Email Address':'jordan@email.com','Phone Number':'+1 (212) 555-0100','Instagram Handle':'@jordansmith','Industry / What You Do':'Finance'},
    {submittedAt:'2026-06-18 19:11', tier:'Friends & Family', 'First Name':'Maya','Last Name':'Reyes','Email Address':'maya@email.com','Phone Number':'+1 (646) 555-0148','Instagram Handle':'@mayareyes','Industry / What You Do':'Art / Design'},
    {submittedAt:'2026-06-18 19:22', tier:'General', 'First Name':'Devon','Last Name':'Clarke','Email Address':'devon@email.com','Phone Number':'+1 (917) 555-0173','Instagram Handle':'@devonc','Industry / What You Do':'Architecture'}
  ];

  function esc(v){ return String(v==null?'':v).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

  function igLink(v){
    var raw=String(v==null?'':v).trim();
    if(!raw) return '';
    var user=raw.replace(/^@+/,'').replace(/^https?:\/\/(www\.)?instagram\.com\//i,'').replace(/[\/?].*$/,'').trim();
    if(!user) return esc(raw);
    return '<a class="ig-link" href="https://instagram.com/'+encodeURIComponent(user)+'" target="_blank" rel="noopener">'+esc(raw)+'</a>';
  }

  function columns(data){
    var seen={}, cols=[];
    ORDER.forEach(function(k){ if(data.some(function(r){return k in r;})){ cols.push(k); seen[k]=1; } });
    data.forEach(function(r){ Object.keys(r).forEach(function(k){ if(!seen[k]){ seen[k]=1; cols.push(k); } }); });
    return cols;
  }

  function filtered(){
    var q=(document.getElementById('search').value||'').toLowerCase().trim();
    var t=document.getElementById('tier').value;
    return rows.filter(function(r){
      if(t && String(r.tier||'')!==t) return false;
      if(!q) return true;
      return Object.keys(r).some(function(k){ return String(r[k]||'').toLowerCase().indexOf(q)>=0; });
    });
  }

  function render(){
    var data=filtered(), cols=columns(rows), el=document.getElementById('table');
    document.getElementById('count').textContent=' · '+data.length+(data.length===1?' entry':' entries');
    if(!data.length){ el.innerHTML='<div class="empty">No submissions.</div>'; return; }
    var html='<table><thead><tr>'+cols.map(function(c){return '<th>'+esc(c)+'</th>';}).join('')+'</tr></thead><tbody>';
    html+=data.map(function(r){
      return '<tr>'+cols.map(function(c){
        var cls = (c==='tier' && /family|ff/i.test(String(r[c]||''))) ? ' class="tier-ff"' : '';
        var val = (c==='Instagram Handle') ? igLink(r[c]) : esc(r[c]);
        return '<td'+cls+'>'+val+'</td>';
      }).join('')+'</tr>';
    }).join('');
    el.innerHTML=html+'</tbody></table>';
  }

  function tierOptions(){
    var sel=document.getElementById('tier'), have={};
    Array.from(sel.options).slice(1).forEach(function(o){have[o.value]=1;});
    rows.forEach(function(r){ var t=String(r.tier||''); if(t && !have[t]){ have[t]=1; var o=document.createElement('option'); o.value=o.textContent=t; sel.appendChild(o); } });
  }

  function toCSV(){
    var data=filtered(), cols=columns(rows);
    var lines=[cols.map(q).join(',')].concat(data.map(function(r){ return cols.map(function(c){return q(r[c]);}).join(','); }));
    function q(v){ v=String(v==null?'':v); return '"'+v.replace(/"/g,'""')+'"'; }
    var blob=new Blob([lines.join('\n')],{type:'text/csv'});
    var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='guestlist.csv'; a.click();
  }

  function load(){
    document.getElementById('table').innerHTML='<div class="loading">Loading…</div>';
    if(/[?&]demo/.test(location.search)){
      rows=DEMO.slice(); tierOptions(); render(); return Promise.resolve();
    }
    return fetch(API, { headers:{ 'Authorization':'Bearer '+code } })
      .then(function(r){ if(r.status===401||r.status===403) throw new Error('unauthorized'); if(!r.ok) throw new Error('http '+r.status); return r.json(); })
      .then(function(data){ rows=Array.isArray(data)?data:(data.submissions||data.rows||[]); tierOptions(); render(); })
      .catch(function(e){ throw e; });
  }

  function unlock(){
    code=pass.value.trim(); if(!code){ return; }
    err.textContent='';
    load().then(enter).catch(function(e){
      err.textContent = e.message==='unauthorized' ? 'Incorrect passcode.' : 'Could not reach the server.';
    });
  }
  function enter(){
    sessionStorage.setItem('pg_admin', code);
    gate.style.display='none'; app.classList.add('show');
  }

  document.getElementById('enter').addEventListener('click', unlock);
  pass.addEventListener('keydown', function(e){ if(e.key==='Enter') unlock(); });

  /* show/hide passcode */
  var EYE_SHOW='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>';
  var EYE_HIDE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20C5 20 1 12 1 12a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="2" y1="2" x2="22" y2="22"/></svg>';
  var eyeBtn=document.getElementById('toggle-pass');
  eyeBtn.innerHTML=EYE_SHOW;
  eyeBtn.addEventListener('click', function(){
    var nowShown = pass.type==='text';
    pass.type = nowShown ? 'password' : 'text';
    eyeBtn.innerHTML = nowShown ? EYE_SHOW : EYE_HIDE;
    eyeBtn.setAttribute('aria-label', nowShown ? 'Show passcode' : 'Hide passcode');
    pass.focus();
  });
  document.getElementById('search').addEventListener('input', render);
  document.getElementById('tier').addEventListener('change', render);
  document.getElementById('refresh').addEventListener('click', function(){ load().catch(function(){}); });
  document.getElementById('csv').addEventListener('click', toCSV);
  document.getElementById('logout').addEventListener('click', function(){ sessionStorage.removeItem('pg_admin'); location.reload(); });

  /* resume a session */
  var saved=sessionStorage.getItem('pg_admin');
  if(saved){ code=saved; load().then(enter).catch(function(){ sessionStorage.removeItem('pg_admin'); }); }
})();
</script>
</body>
</html>
