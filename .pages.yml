# Pages CMS configuration — https://pagescms.org
# Defines the no-code editing UI for The Pregame. The team edits the
# content/*.json files through a web form; Pages CMS commits the change
# to GitHub, and Vercel redeploys automatically. No code changes needed.

media:
  - name: photos
    label: Event photos
    input: photos
    output: /photos
    extensions: [jpg, jpeg, png, webp]
  - name: partners
    label: Partner logos
    input: partners
    output: /partners
    extensions: [svg, png, jpg, jpeg, webp]

content:
  # ---- Homepage: event, ticker, Coming Soon, and on-page copy ----
  - name: home
    label: Homepage
    type: file
    path: content/home.json
    format: json
    fields:
      - name: event
        label: Upcoming event
        type: object
        description: When an event is live, turn it on and fill in the details. When off, the homepage shows the headline below.
        fields:
          - { name: active, label: Event is live?, type: boolean, default: false }
          - { name: city, label: City, type: string }
          - { name: date, label: Date (e.g. July 18), type: string }
          - { name: venue, label: Venue (optional), type: string }
      - name: operatingCities
        label: City ticker (cities you operate in)
        type: string
        list: true
      - name: expansionCities
        label: Coming Soon cities
        type: string
        list: true
        description: Teaser cities shown on the homepage. Remove one once its event is announced above.
      - name: copy
        label: Homepage text
        type: object
        description: 'Tip: color individual words by wrapping them like {{yellow:these words}}. Colors: cream, white, yellow, gray, red, orange, green, blue, purple, pink — or a hex code like {{#e8d84a:word}}.'
        fields:
          - { name: headline, label: Headline (shown when no event is live), type: string }
          - { name: cta, label: Main button label, type: string }
          - { name: comingSoonLabel, label: "\"Coming Soon\" label", type: string }
          - { name: exclusivityNote, label: Sign-up form note, type: text }

  # ---- About page ----
  - name: about
    label: About page
    type: file
    path: content/about.json
    format: json
    fields:
      - { name: heading, label: Heading, type: string, description: 'Color individual words by wrapping them like {{yellow:these words}}.' }
      - name: paragraphs
        label: Paragraphs
        type: text
        list: true
        description: 'Color individual words by wrapping them like {{yellow:these words}}. Colors: cream, white, yellow, gray, red, orange, green, blue, purple, pink — or a hex code like {{#e8d84a:word}}.'

  # ---- Partners page: logos + intro + Work With Us ----
  - name: partners
    label: Partners
    type: file
    path: content/partners.json
    format: json
    fields:
      - { name: subtitle, label: Page subtitle, type: string, description: 'Color individual words by wrapping them like {{yellow:these words}}.' }
      - name: current
        label: Current partners
        type: object
        list: true
        fields:
          - { name: name, label: Brand name, type: string }
          - { name: logo, label: Logo image (optional), type: image, options: { media: partners }, description: "Leave empty to show the brand name as text." }
          - { name: url, label: Website link (optional), type: string, description: "Full address including https:// — the tile links here." }
      - name: past
        label: Past partners
        type: object
        list: true
        fields:
          - { name: name, label: Brand name, type: string }
          - { name: logo, label: Logo image (optional), type: image, options: { media: partners } }
          - { name: url, label: Website link (optional), type: string, description: "Full address including https:// — the tile links here." }
      - name: workWithUs
        label: Work With Us section
        type: object
        description: 'Tip: color individual words in the heading or body by wrapping them like {{yellow:these words}}. Colors: cream, white, yellow, gray, red, orange, green, blue, purple, pink — or a hex code like {{#e8d84a:word}}.'
        fields:
          - { name: heading, label: Heading, type: string }
          - { name: body, label: Body copy, type: text }
          - { name: email, label: Sponsorship email, type: string }
          - { name: emailLabel, label: Email button label, type: string }
          - { name: instagramLabel, label: Instagram button label, type: string }

  # ---- Archive: events, photos, and blurbs ----
  - name: archive
    label: Archive events
    type: file
    path: content/archive.json
    format: json
    fields:
      - name: events
        label: Events
        type: object
        list: true
        fields:
          - { name: id, label: ID (lowercase, no spaces, unique), type: string }
          - { name: name, label: Venue / event name, type: string }
          - { name: volume, label: Volume (e.g. Vol. 04), type: string }
          - { name: date, label: Date (e.g. June 2026), type: string }
          - { name: blurb, label: Blurb (1–2 sentences), type: text }
          - { name: guests, label: Guest count (e.g. 31 guests), type: string }
          - name: writeup
            label: Write-up (full description — blank line between paragraphs)
            type: text
          - { name: thumb, label: Thumbnail image, type: image, options: { media: photos } }
          - { name: photos, label: Gallery photos (aim for 8–12), type: image, list: true, options: { media: photos } }
          - name: drinks
            label: Drink menu (one per line — lines like "Wine:" work as sub-headers)
            type: string
            list: true
          - name: sounds
            label: Sounds — DJs / sets (one per line)
            type: string
            list: true
          - name: team
            label: Team / credits (one per line)
            type: string
            list: true
          - name: sponsors
            label: Sponsors (one per line)
            type: string
            list: true
